spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual   # ACK so depois do efeito gravado
        prefetch: 1                # distribui melhor entre instancias
  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteca
    username: biblioteca
    password: biblioteca
  sql:
    init:
      mode: always
demo:
  atraso-ms: 300   # atraso artificial nas estatisticas, so para visualizar a divisao entre instancias
---
spring.config.activate.on-profile: produtor
server.port: 8080
---
spring.config.activate.on-profile: circulacao
server.port: 8081
---
spring.config.activate.on-profile: comunicacao
server.port: 8082
---
spring.config.activate.on-profile: multas
server.port: 8083
---
spring.config.activate.on-profile: auditoria
server.port: 8084
---
spring.config.activate.on-profile: estatisticas
server.port: 8085
